apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.3.0
    helm:
      values: |
        service:
	  spec
            type: ClusterIP

        ports:
          web:
            port: 8000
            exposedPort: 80

          websecure:
            port: 8443
            exposedPort: 443

        providers:
          kubernetesIngress:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
