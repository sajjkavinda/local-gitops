
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: nginx-image-updater
  namespace: argocd

spec:
  writeBackConfig:
    method: git:secret:image-updater-git-creds
    gitConfig:
      repository: https://github.com/sajjkavinda/local-gitops.git
      branch: main
      writeBackTarget: helmvalues:./values.yaml

  applicationRefs:
    - namePattern: nginx
      images:
        - alias: nginx
          imageName: nginx:1.x
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
          commonUpdateSettings:
            updateStrategy: semver

